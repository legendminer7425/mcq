<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CMA Inter MCQ Portal</title>
  <style>
    :root {
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --bg: #f8fafc;
      --card: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --border: #e2e8f0;
      --success: #10b981;
      --success-bg: #ecfdf5;
      --danger: #ef4444;
      --danger-bg: #fef2f2;
      --warning: #f59e0b;
      --warning-bg: #fffbeb;
      --radius: 14px;
      --shadow: 0 10px 25px -10px rgba(15, 23, 42, 0.2);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      min-height: 100vh;
      background:
        radial-gradient(circle at top left, rgba(37, 99, 235, 0.12), transparent 32rem),
        var(--bg);
      color: var(--text);
      padding: 20px 12px;
      display: flex;
      justify-content: center;
    }

    .app {
      width: 100%;
      max-width: 900px;
    }

    .navbar,
    .card {
      background: rgba(255, 255, 255, 0.95);
      border: 1px solid rgba(226, 232, 240, 0.8);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }

    .navbar {
      padding: 20px 22px;
      margin-bottom: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
    }

    .title {
      color: var(--primary);
      font-size: clamp(1.3rem, 3vw, 1.7rem);
      font-weight: 900;
    }

    .subtitle {
      color: var(--muted);
      font-size: 0.92rem;
      margin-top: 4px;
    }

    .card {
      padding: clamp(18px, 4vw, 30px);
      margin-bottom: 20px;
    }

    .hidden { display: none !important; }

    .section-heading {
      font-size: 1.25rem;
      margin-bottom: 6px;
    }

    .section-copy {
      color: var(--muted);
      line-height: 1.5;
    }

    .subjects {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(235px, 1fr));
      gap: 16px;
      margin-top: 18px;
    }

    .subject-card {
      border: 2px solid var(--border);
      border-radius: var(--radius);
      padding: 18px;
      cursor: pointer;
      transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
      background: #fff;
    }

    .subject-card:hover,
    .subject-card:focus-visible {
      border-color: var(--primary);
      transform: translateY(-2px);
      box-shadow: 0 14px 26px -18px rgba(37, 99, 235, 0.7);
      outline: none;
    }

    .subject-code {
      color: var(--primary);
      font-size: 0.78rem;
      font-weight: 900;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .subject-title {
      font-size: 1.02rem;
      font-weight: 800;
      line-height: 1.35;
      margin-bottom: 14px;
    }

    .subject-meta {
      color: var(--muted);
      font-size: 0.86rem;
      border-top: 1px solid var(--border);
      padding-top: 12px;
      display: flex;
      justify-content: space-between;
      gap: 10px;
    }

    .saved-count { color: var(--success); font-weight: 800; }

    .quiz-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      border-bottom: 2px solid var(--border);
      padding-bottom: 16px;
      margin-bottom: 18px;
      flex-wrap: wrap;
    }

    #quiz-title { font-size: 1.18rem; }

    .progress-bg {
      width: 100%;
      height: 9px;
      background: var(--border);
      border-radius: 999px;
      overflow: hidden;
      margin-bottom: 20px;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--primary), #60a5fa);
      transition: width 0.25s ease;
    }

    .q-meta {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      color: var(--muted);
      font-size: 0.9rem;
      font-weight: 700;
      margin-bottom: 14px;
      flex-wrap: wrap;
    }

    .bookmark {
      color: #b45309;
      cursor: pointer;
      user-select: none;
    }

    .q-text {
      font-size: clamp(1.08rem, 2.5vw, 1.25rem);
      font-weight: 800;
      line-height: 1.55;
      margin-bottom: 20px;
    }

    .options {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 22px;
    }

    .option-btn {
      border: 2px solid var(--border);
      background: #fff;
      border-radius: 12px;
      padding: 14px 16px;
      text-align: left;
      cursor: pointer;
      font-size: 1rem;
      line-height: 1.35;
      display: flex;
      gap: 12px;
      align-items: flex-start;
      transition: background 0.2s ease, border-color 0.2s ease;
    }

    .option-btn:hover,
    .option-btn:focus-visible {
      border-color: var(--primary);
      background: #eff6ff;
      outline: none;
    }

    .option-btn.correct {
      border-color: var(--success);
      background: var(--success-bg);
      font-weight: 800;
    }

    .option-btn.wrong {
      border-color: var(--danger);
      background: var(--danger-bg);
      font-weight: 800;
    }

    .option-label { color: var(--primary); font-weight: 900; }

    .explanation {
      background: var(--warning-bg);
      border-left: 4px solid var(--warning);
      color: #92400e;
      padding: 14px 16px;
      border-radius: 10px;
      margin-bottom: 20px;
      line-height: 1.55;
    }

    .actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .action-group {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .btn {
      border: none;
      border-radius: 10px;
      padding: 10px 16px;
      font-weight: 800;
      cursor: pointer;
      font-size: 0.95rem;
      transition: background 0.2s ease, opacity 0.2s ease;
    }

    .btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .btn-primary { background: var(--primary); color: #fff; }
    .btn-primary:hover { background: var(--primary-dark); }
    .btn-secondary { background: var(--border); color: var(--text); }
    .btn-outline { background: transparent; color: var(--text); border: 2px solid var(--border); }

    .result-box { text-align: center; padding: 14px 0; }
    .score { font-size: clamp(2rem, 8vw, 3.5rem); font-weight: 950; color: var(--primary); margin: 14px 0 6px; }
    .result-list { margin-top: 22px; text-align: left; display: grid; gap: 12px; }
    .result-item { border: 1px solid var(--border); border-radius: 12px; padding: 14px; background: #fff; }
    .result-item.correct { border-color: var(--success); }
    .result-item.wrong { border-color: var(--danger); }

    @media (max-width: 620px) {
      .actions, .action-group { flex-direction: column; width: 100%; }
      .btn { width: 100%; }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="navbar">
      <div>
        <div class="title">📚 CMA Inter MCQ Portal</div>
        <p class="subtitle">Static GitHub Pages app. Your progress is saved on this device.</p>
      </div>
      <button class="btn btn-outline" type="button" onclick="resetProgress()">Reset Progress</button>
    </header>

    <section id="dashboard" class="card" aria-live="polite">
      <h1 class="section-heading">Select Subject</h1>
      <p class="section-copy">Choose a paper to practice MCQs. Answers, bookmarks, and progress are stored locally in your browser.</p>
      <div id="subjects" class="subjects"></div>
    </section>

    <section id="quiz" class="card hidden" aria-live="polite">
      <div class="quiz-header">
        <h2 id="quiz-title">Subject</h2>
        <button class="btn btn-outline" type="button" onclick="showDashboard()">← Dashboard</button>
      </div>

      <div class="progress-bg" aria-hidden="true"><div id="progress-fill" class="progress-fill"></div></div>

      <div class="q-meta">
        <span id="q-count">Question 1 of 1</span>
        <span id="bookmark-btn" class="bookmark" onclick="toggleBookmark()">☆ Bookmark</span>
      </div>

      <div id="q-text" class="q-text"></div>
      <div id="options" class="options"></div>
      <div id="explanation" class="explanation hidden"></div>

      <div class="actions">
        <button id="prev-btn" class="btn btn-secondary" type="button" onclick="prevQuestion()">Previous</button>
        <div class="action-group">
          <button class="btn btn-outline" type="button" onclick="clearAnswer()">Clear Choice</button>
          <button id="next-btn" class="btn btn-primary" type="button" onclick="nextQuestion()">Next</button>
          <button id="submit-btn" class="btn btn-primary hidden" type="button" onclick="submitQuiz()">Submit Test</button>
        </div>
      </div>
    </section>

    <section id="result" class="card hidden" aria-live="polite">
      <div class="result-box">
        <h2>Quiz Result</h2>
        <div id="score" class="score"></div>
        <p id="result-text" class="section-copy"></p>
        <div class="action-group" style="justify-content:center; margin-top:18px;">
          <button class="btn btn-primary" type="button" onclick="restartQuiz()">Try Again</button>
          <button class="btn btn-outline" type="button" onclick="showDashboard()">Back to Dashboard</button>
        </div>
      </div>
      <div id="result-list" class="result-list"></div>
    </section>
  </main>

  <script>
    const SUBJECT_DATA = {
      paper5: {
        id: "paper5",
        title: "Paper 5: Business Laws and Ethics",
        code: "CMA-P5",
        questions: [
          { id: "p5_1", question: "Right to Property is a:", options: ["Fundamental Right", "Fundamental Duty", "Constitutional Right", "None of the above"], correctAnswer: 2, explanation: "Right to Property was removed from Fundamental Rights by the 44th Amendment and made a Constitutional Right under Article 300A." },
          { id: "p5_2", question: "The Constitution of India describes India as:", options: ["A federation", "Quasi-federal", "A Union of states", "None of the above"], correctAnswer: 2, explanation: "Article 1(1) states that India, that is Bharat, shall be a Union of States." },
          { id: "p5_3", question: "Acceptance to be valid must:", options: ["Be absolute", "Be unqualified", "Both be absolute & unqualified", "Be conditional"], correctAnswer: 2, explanation: "Under Section 7 of the Indian Contract Act, acceptance must be absolute and unqualified." },
          { id: "p5_4", question: "An agreement made without consideration is:", options: ["Valid", "Illegal", "Voidable", "Void"], correctAnswer: 3, explanation: "According to Section 25 of the Indian Contract Act, an agreement made without consideration is void." }
        ]
      },
      paper6: {
        id: "paper6",
        title: "Paper 6: Financial Accounting",
        code: "CMA-P6",
        questions: [
          { id: "p6_1", question: "Which of the following is not a method of charging depreciation?", options: ["Sinking Fund Method", "Sum of years Digit Method", "Working hours Method", "Asset's Life-cycle Method"], correctAnswer: 3, explanation: "Asset's Life-cycle Method is not a standard depreciation calculation method." },
          { id: "p6_2", question: "Wages paid for installation of machinery is treated as:", options: ["Revenue Expenditure", "Capital Expenditure", "Deferred Revenue Expenditure", "Operating Expense"], correctAnswer: 1, explanation: "Installation costs are added to the cost of the asset as capital expenditure." }
        ]
      },
      paper7: {
        id: "paper7",
        title: "Paper 7: Direct and Indirect Taxation",
        code: "CMA-P7",
        questions: [
          { id: "p7_1", question: "GST was introduced in India with effect from:", options: ["1.1.2017", "1.4.2017", "1.1.2018", "1.7.2017"], correctAnswer: 3, explanation: "GST came into effect across India on 1st July 2017." },
          { id: "p7_2", question: "Under which article of the Constitution of India has the GST Council been constituted?", options: ["Article 246", "Article 246A", "Article 279A", "Article 265"], correctAnswer: 2, explanation: "Article 279A empowered the President to constitute the GST Council." }
        ]
      },
      paper8: {
        id: "paper8",
        title: "Paper 8: Cost Accounting",
        code: "CMA-P8",
        questions: [
          { id: "p8_1", question: "Prime Cost is:", options: ["All costs incurred in manufacturing", "The total of direct costs", "The material cost of a product", "The cost of operating a department"], correctAnswer: 1, explanation: "Prime Cost is the sum of Direct Material, Direct Labour, and Direct Expenses." },
          { id: "p8_2", question: "In Marginal Costing, fixed costs are treated as:", options: ["Product cost", "Partially variable cost", "Period cost", "Avoidable cost"], correctAnswer: 2, explanation: "Fixed costs are treated as Period Costs in marginal costing and written off against contribution." }
        ]
      },
      paper9: {
        id: "paper9",
        title: "Paper 9: Operations Management & Strategic Management",
        code: "CMA-P9",
        questions: [
          { id: "p9_1", question: "Operations Management deals with:", options: ["Both tangible products and intangible services", "Tangible products only", "Intangible services only", "None of the above"], correctAnswer: 0, explanation: "Operations management applies to both physical product manufacturing and service delivery." },
          { id: "p9_2", question: "Continuous improvement in TQM is also known as:", options: ["Six Sigma", "Benchmarking", "KAIZEN", "JIT"], correctAnswer: 2, explanation: "Kaizen is the Japanese term for continuous incremental process improvement." }
        ]
      },
      paper10: {
        id: "paper10",
        title: "Paper 10: Corporate Accounting & Auditing",
        code: "CMA-P10",
        questions: [
          { id: "p10_1", question: "Buy-back of equity shares in any financial year should not exceed:", options: ["10% of net worth", "25% of aggregate paid-up capital and free reserves", "25% of paid-up equity capital", "50% of capital"], correctAnswer: 1, explanation: "Under Section 68(2) of the Companies Act 2013, buy-back cannot exceed 25% of aggregate paid-up capital and free reserves." }
        ]
      },
      paper11: {
        id: "paper11",
        title: "Paper 11: Financial Management & Business Data Analytics",
        code: "CMA-P11",
        questions: [
          { id: "p11_1", question: "Working Capital is calculated as:", options: ["Core current assets less core liabilities", "Current assets less current liabilities", "Liquid assets less current liabilities", "Total assets less total liabilities"], correctAnswer: 1, explanation: "Net Working Capital = Current Assets - Current Liabilities." }
        ]
      },
      paper12: {
        id: "paper12",
        title: "Paper 12: Management Accounting",
        code: "CMA-P12",
        questions: [
          { id: "p12_1", question: "In an ABC system, machine set-up is classified as a:", options: ["Batch level activity", "Unit level activity", "Product level activity", "Facility level activity"], correctAnswer: 0, explanation: "Set-up is performed each time a batch of products is processed, making it a batch-level activity." }
        ]
      }
    };

    const LS_KEY = "cma_mcq_static_progress_v1";
    let activePaperId = null;
    let activeQuestions = [];
    let currentQIndex = 0;

    function getProgress() {
      try {
        return JSON.parse(localStorage.getItem(LS_KEY)) || { subjects: {}, bookmarks: [] };
      } catch (error) {
        return { subjects: {}, bookmarks: [] };
      }
    }

    function saveProgress(progress) {
      localStorage.setItem(LS_KEY, JSON.stringify(progress));
    }

    function ensureSubjectProgress(progress, paperId) {
      if (!progress.subjects[paperId]) progress.subjects[paperId] = { answers: {} };
      if (!progress.subjects[paperId].answers) progress.subjects[paperId].answers = {};
    }

    function renderDashboard() {
      const container = document.getElementById("subjects");
      const progress = getProgress();
      container.innerHTML = "";

      Object.values(SUBJECT_DATA).forEach((subject) => {
        const answers = progress.subjects[subject.id]?.answers || {};
        const answeredCount = Object.keys(answers).length;
        const card = document.createElement("article");
        card.className = "subject-card";
        card.tabIndex = 0;
        card.onclick = () => startQuiz(subject.id);
        card.onkeydown = (event) => {
          if (event.key === "Enter" || event.key === " ") startQuiz(subject.id);
        };
        card.innerHTML = `
          <div class="subject-code">${subject.code}</div>
          <div class="subject-title">${subject.title}</div>
          <div class="subject-meta">
            <span>📝 ${subject.questions.length} MCQs</span>
            <span class="saved-count">${answeredCount > 0 ? `${answeredCount} saved` : "Start"}</span>
          </div>
        `;
        container.appendChild(card);
      });

      document.getElementById("dashboard").classList.remove("hidden");
      document.getElementById("quiz").classList.add("hidden");
      document.getElementById("result").classList.add("hidden");
    }

    function startQuiz(paperId) {
      activePaperId = paperId;
      activeQuestions = SUBJECT_DATA[paperId].questions;
      currentQIndex = 0;
      document.getElementById("quiz-title").textContent = SUBJECT_DATA[paperId].title;
      document.getElementById("dashboard").classList.add("hidden");
      document.getElementById("result").classList.add("hidden");
      document.getElementById("quiz").classList.remove("hidden");
      renderQuestion();
    }

    function renderQuestion() {
      const question = activeQuestions[currentQIndex];
      const progress = getProgress();
      const savedAnswer = progress.subjects[activePaperId]?.answers?.[question.id];
      const bookmarkKey = `${activePaperId}:${question.id}`;
      const labels = ["A", "B", "C", "D"];

      document.getElementById("q-count").textContent = `Question ${currentQIndex + 1} of ${activeQuestions.length}`;
      document.getElementById("progress-fill").style.width = `${((currentQIndex + 1) / activeQuestions.length) * 100}%`;
      document.getElementById("q-text").textContent = question.question;
      document.getElementById("bookmark-btn").textContent = progress.bookmarks.includes(bookmarkKey) ? "★ Bookmarked" : "☆ Bookmark";

      const optionsContainer = document.getElementById("options");
      optionsContainer.innerHTML = "";

      question.options.forEach((option, index) => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "option-btn";
        if (savedAnswer !== undefined) {
          if (index === question.correctAnswer) button.classList.add("correct");
          else if (index === savedAnswer) button.classList.add("wrong");
        }
        button.innerHTML = `<span class="option-label">${labels[index]}.</span><span>${option}</span>`;
        button.onclick = () => selectAnswer(question.id, index);
        optionsContainer.appendChild(button);
      });

      const explanation = document.getElementById("explanation");
      if (savedAnswer !== undefined) {
        explanation.classList.remove("hidden");
        explanation.innerHTML = `<strong>💡 Explanation:</strong> ${question.explanation}`;
      } else {
        explanation.classList.add("hidden");
        explanation.textContent = "";
      }

      document.getElementById("prev-btn").disabled = currentQIndex === 0;
      document.getElementById("next-btn").classList.toggle("hidden", currentQIndex === activeQuestions.length - 1);
      document.getElementById("submit-btn").classList.toggle("hidden", currentQIndex !== activeQuestions.length - 1);
    }

    function selectAnswer(questionId, answerIndex) {
      const progress = getProgress();
      ensureSubjectProgress(progress, activePaperId);
      progress.subjects[activePaperId].answers[questionId] = answerIndex;
      saveProgress(progress);
      renderQuestion();
    }

    function clearAnswer() {
      const question = activeQuestions[currentQIndex];
      const progress = getProgress();
      if (progress.subjects[activePaperId]?.answers) {
        delete progress.subjects[activePaperId].answers[question.id];
        saveProgress(progress);
      }
      renderQuestion();
    }

    function nextQuestion() {
      if (currentQIndex < activeQuestions.length - 1) {
        currentQIndex += 1;
        renderQuestion();
      }
    }

    function prevQuestion() {
      if (currentQIndex > 0) {
        currentQIndex -= 1;
        renderQuestion();
      }
    }

    function toggleBookmark() {
      const question = activeQuestions[currentQIndex];
      const progress = getProgress();
      const bookmarkKey = `${activePaperId}:${question.id}`;
      const existingIndex = progress.bookmarks.indexOf(bookmarkKey);
      if (existingIndex >= 0) progress.bookmarks.splice(existingIndex, 1);
      else progress.bookmarks.push(bookmarkKey);
      saveProgress(progress);
      renderQuestion();
    }

    function submitQuiz() {
      const progress = getProgress();
      const answers = progress.subjects[activePaperId]?.answers || {};
      let score = 0;

      activeQuestions.forEach((question) => {
        if (answers[question.id] === question.correctAnswer) score += 1;
      });

      const total = activeQuestions.length;
      const percentage = Math.round((score / total) * 100);
      document.getElementById("score").textContent = `${score} / ${total} (${percentage}%)`;
      document.getElementById("result-text").textContent = percentage >= 50
        ? "Passed. Great work — keep revising the explanations."
        : "Keep practicing. Review the answers below and try again.";

      const resultList = document.getElementById("result-list");
      resultList.innerHTML = "";
      activeQuestions.forEach((question, index) => {
        const selected = answers[question.id];
        const isCorrect = selected === question.correctAnswer;
        const item = document.createElement("article");
        item.className = `result-item ${isCorrect ? "correct" : "wrong"}`;
        item.innerHTML = `
          <strong>Q${index + 1}. ${question.question}</strong><br>
          <span>Your answer: ${selected === undefined ? "Not answered" : question.options[selected]}</span><br>
          <span>Correct answer: ${question.options[question.correctAnswer]}</span><br>
          <small>${question.explanation}</small>
        `;
        resultList.appendChild(item);
      });

      document.getElementById("quiz").classList.add("hidden");
      document.getElementById("result").classList.remove("hidden");
    }

    function restartQuiz() {
      currentQIndex = 0;
      document.getElementById("result").classList.add("hidden");
      document.getElementById("quiz").classList.remove("hidden");
      renderQuestion();
    }

    function showDashboard() {
      renderDashboard();
    }

    function resetProgress() {
      if (confirm("Reset all saved progress and bookmarks?")) {
        localStorage.removeItem(LS_KEY);
        renderDashboard();
      }
    }

    window.addEventListener("load", renderDashboard);
  </script>
</body>
</html>
